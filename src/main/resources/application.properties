# Application Name
spring.application.name=labtracker

# Server Configuration
server.port=8080

# Database Configuration (MySQL)
# REPLACE 'root' AND 'your_password' WITH YOUR LOCAL MYSQL USERNAME AND PASSWORD
spring.datasource.url=jdbc:mysql://localhost:3306/lab_tracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=sql@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration
# 256-bit secure secret key and token expiration time (24 hours in milliseconds)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration-ms=86400000

# College Context Configuration (Anurag University - ECE Department)
app.college-name=Anurag University
app.department-name=Department of Electronics and Communication Engineering
# Configurable student roll number regex: e.g. 24eg104e29
# Structure: 2 digits year (24) + 2 letters college (eg) + 3 digits branch (104) + 1 letter section (e) + 2 digits roll (29)
app.rollno-pattern=^[0-9]{2}[a-zA-Z]{2}[0-9]{3}[a-zA-Z][0-9]{2}$
app.default-student-password=Student@123

